<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота: Робота з часом</title>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>Моніторинг часу на сторінці</h2>
        <p>Сторінку завантажено: <span id="load-time" style="color: gray;">--.--.---- --:--</span></p>
        <p style="font-size: 20px;">
            Ви перебуваєте тут вже: <strong id="timer">0</strong> секунд
        </p>
    </div>
    <script>
        const now = new Date();
        const day = String(now.getDate()).padStart(2, "0");
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const year = now.getFullYear();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");

        document.getElementById('load-time').textContent = 
        `${day}.${month}.${year} ${hours}:${minutes}`;
  
        const startTime = Date.now(); 
        const timerDisplay = document.getElementById('timer');

        function updateTimer() {
            const currentTime = Date.now();
            const secondsPassed = Math.floor((currentTime - startTime) / 1000);
            timerDisplay.textContent = secondsPassed;
        }

        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
