<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Варіант 5</title>
  <style>
    .highlighted {
      background-color: #ffeb3b;
      padding: 5px;
      border-radius: 4px;
      font-weight: bold;
    }
    p {
      cursor: pointer; 
      transition: background 0.3s;
    }
  </style>
</head>
<body>
  <h2>Контейнер</h2>
  <div id="container"></div>
  <button onclick="addElement()">Додати елемент</button>
  <script>
    function addElement() {
      const newEl = document.createElement("p");
      newEl.textContent = "Новий елемент (натисни на мене)";
      newEl.addEventListener("click", function() {
        this.classList.toggle("highlighted"); 
      });

      document.getElementById("container").appendChild(newEl);
    }
  </script>

</body>
</html>
