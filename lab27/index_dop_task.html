<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №27 - 5 Варіант</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        /* Стилі для Таблиці (Завдання 1) */
        table { border-collapse: collapse; width: 100%; max-width: 400px; margin-bottom: 30px; }
        td, th { border: 1px solid #000; padding: 8px; text-align: left; cursor: pointer; }
        .active { background-color: #d1e7dd; font-weight: bold; }

        /* Стилі для Форми з дебаунсингом (Завдання 2) */
        .form-container {
            max-width: 400px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { 
            width: 100%; 
            padding: 8px; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 4px;
            outline: none;
        }
        .error-msg { color: #dc3545; font-size: 14px; margin-top: 5px; min-height: 20px; }
    </style>
</head>
<body>  
    <h3>Завдання 2. Валідація форми з дебаунсингом (500 мс)</h3>
    <div class="form-container">
        <form id="val-form" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="username">Ім'я користувача (мін. 3 символи):</label>
                <input type="text" id="username" placeholder="Почніть вводити..." autocomplete="off">
                <div id="error-msg" class="error-msg"></div>
            </div>
        </form>
    </div>

    <script>
        function debounce(fn, delay) {
            let timer;
            return function (...args) {
                clearTimeout(timer); 
                timer = setTimeout(() => fn.apply(this, args), delay); 
            };
        }

        const inputField = document.getElementById('username');
        const errorDiv = document.getElementById('error-msg');

        function validateInput() {
            const value = inputField.value.trim();
            
            if (value.length > 0 && value.length < 3) {
                errorDiv.textContent = "Помилка: Ім'я занадто коротке!";
                inputField.style.borderColor = "#dc3545"; // Червоний
            } else if (value.length >= 3) {
                errorDiv.textContent = ""; 
                inputField.style.borderColor = "#198754"; // Зелений
            } else {
                errorDiv.textContent = ""; 
                inputField.style.borderColor = "#ccc";
            }
            
            console.log(`Валідація викликана для: "${value}"`);
        }

        inputField.addEventListener('input', debounce(validateInput, 500));
    </script>
</body>
</html>
