<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Варіант 5</title>
</head>
<body>

  <h2>Форма</h2>

  <form id="myForm">
    <input type="text" id="nameInput" placeholder="Ім'я" required><br><br>
    <input type="email" id="emailInput" placeholder="Email" required><br><br>
    <button type="submit">Відпрвити</button>
  </form>

  <p id="output"></p>

  <script>
    document.getElementById("myForm").addEventListener("submit", function(event) {

      event.preventDefault();
      const name = document.getElementById("nameInput").value;
      const email = document.getElementById("emailInput").value;

      console.log("Ім'я:", name);
      console.log("Email:", email);
      document.getElementById("output").textContent = "Ім'я: " + name + ", Email: " + email;
      this.reset();
    });
  </script>

</body>
</html>
